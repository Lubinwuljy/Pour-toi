<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
min-height:100dvh;overflow-x:hidden;overflow-y:auto;
display:flex;justify-content:center;align-items:center;
font-family:'Poppins','Segoe UI',sans-serif;color:white;
background:linear-gradient(-45deg,#ff5f6d,#ffc371,#ff9a9e,#fad0c4);
background-size:400% 400%;animation:bg 12s ease infinite;
padding:env(safe-area-inset-top,20px) 12px env(safe-area-inset-bottom,20px);
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{
width:100%;max-width:600px;padding:clamp(20px,6vw,40px);text-align:center;
background:rgba(255,255,255,.15);backdrop-filter:blur(14px);
border-radius:24px;box-shadow:0 15px 50px rgba(0,0,0,.25);
animation:show 1.5s ease;
margin:auto;
}
@keyframes show{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
h1{
font-family:'Dancing Script','Segoe UI',cursive;
font-size:clamp(2.1em,9vw,3.2em);margin-bottom:14px;line-height:1.25;
background:linear-gradient(90deg,#fff,#ffe066,#fff,#ffb3c6,#fff);
background-size:300% 100%;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:shine 4s linear infinite;
}
@keyframes shine{from{background-position:0%}to{background-position:300%}}
#message{
font-size:clamp(0.95em,4vw,1.15em);line-height:1.8;min-height:0;
text-shadow:0 0 10px rgba(255,255,255,.4);
white-space:pre-wrap;
word-break:break-word;
text-align:left;
}
.heart{position:fixed;bottom:-50px;animation:float linear infinite;pointer-events:none}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-120vh);opacity:0}}
.tip{font-size:.8em;opacity:.8;margin-top:15px}

#btnSuite{margin-top:22px;padding:12px 24px;font-size:clamp(.85em,3.6vw,1em);border:none;border-radius:50px;font-family:'Poppins','Segoe UI',sans-serif;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,#ff758c,#ff7eb3);box-shadow:0 8px 20px rgba(255,110,150,.4);opacity:0;transform:scale(.5);transition:all .6s ease;pointer-events:none;width:100%;max-width:320px}
#btnSuite.visible{opacity:1;transform:scale(1);pointer-events:auto}
#btnSuite.visible:hover{transform:scale(1.08)}
#reactions{margin-top:18px;display:none;gap:12px;justify-content:center;flex-wrap:wrap}
#reactions button{padding:10px 22px;border:none;border-radius:40px;font-size:clamp(.9em,3.8vw,1.05em);font-family:'Segoe UI',sans-serif;font-weight:600;color:#fff;cursor:pointer;transition:transform .3s;flex:0 1 auto}
#reactions button:hover{transform:scale(1.12)}
#btnOui{background:#4ade80;box-shadow:0 6px 15px rgba(74,222,128,.5)}
#btnNon{background:#f87171;box-shadow:0 6px 15px rgba(248,113,113,.5)}
#reponse{margin-top:16px;font-size:clamp(.9em,3.8vw,1.15em);min-height:0;text-shadow:0 0 10px rgba(255,255,255,.4)}
#redirection{margin-top:12px;font-size:.85em;opacity:.85;display:none}

#overlay{
position:fixed;inset:0;display:none;
justify-content:center;align-items:center;
background:rgba(0,0,0,.45);z-index:50;padding:20px;
}
#overlay.visible{display:flex}
#overlayCard{
background:rgba(255,255,255,.18);backdrop-filter:blur(16px);
border-radius:24px;padding:clamp(24px,7vw,40px);
text-align:center;max-width:420px;width:100%;
box-shadow:0 15px 50px rgba(0,0,0,.35);
animation:show .5s ease;
}
</style>
</head>
<body>
<div class="card">
<h1>✨ Salut toi ✨</h1>
<div id="message"></div>
<div class="tip">✨ Touche l'écran pour la musique • Touche le texte pour la relancer ✨</div>
<button id="btnSuite">💌 J'espère que tu as aimé le message</button>
<div id="reactions">
  <button id="btnOui">Oui 😍</button>
  <button id="btnNon">Non 😢</button>
</div>
</div>

<div id="overlay">
  <div id="overlayCard">
    <div id="emojiReact" style="font-size:3em;margin-bottom:10px"></div>
    <div id="reponse"></div>
    <a id="lienEnvoyer" href="#" target="_blank" rel="noopener" style="display:none;margin-top:18px;padding:12px 26px;border-radius:40px;background:#25D366;color:#fff;font-weight:600;text-decoration:none;font-size:clamp(.9em,3.8vw,1.05em);box-shadow:0 6px 15px rgba(37,211,102,.5)">💬 Envoyer sur WhatsApp</a>
  </div>
</div>

<script>
const texte=`Je voulais simplement te dire quelque chose.

Certaines personnes passent dans nos vies sans laisser de trace.
D'autres, au contraire, illuminent les journees par leur gentillesse, leur sourire et leur belle energie.

Tu fais partie de ces personnes rares qui apportent de la lumiere autour d'elles.

Garde toujours cette belle personnalite, cette simplicite et cette facon unique d'inspirer les autres.

Ne change jamais ce qui fait de toi une personne aussi exceptionnelle. ❤️✨`;

let i=0;
function ecrire(){
 if(i<texte.length){
   document.getElementById('message').textContent+=texte.charAt(i);
   i++;
   setTimeout(ecrire,35);
 } else {
   // Texte termine : couper la musique apres un petit moment, puis afficher le bouton
   setTimeout(()=>{
     document.getElementById('btnSuite').classList.add('visible');
   },2000);
 }
}
setTimeout(ecrire,1000);

for(let i=0;i<40;i++){
 let h=document.createElement('div');
 h.className='heart';
 h.innerHTML=['❤️','🔥','🫂','💖','💕','✨'][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(15+Math.random()*25)+'px';
 h.style.animationDuration=(5+Math.random()*6)+'s';
 document.body.appendChild(h);
}
</script>
